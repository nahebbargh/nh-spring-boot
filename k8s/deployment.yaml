apiVersion: apps/v1
kind: Deployment
metadata:
  name: nh-spring-boot
  namespace: default
  labels:
    app: nh-spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nh-spring-boot
  template:
    metadata:
      labels:
        app: nh-spring-boot
    spec:
      containers:
        - name: nh-spring-boot
          image: nahebbargh/nh-spring-boot:latest
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
